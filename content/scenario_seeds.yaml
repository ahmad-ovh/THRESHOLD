seeds:

  # --- teacher seeds ---

  - id: final_paper_feedback
    title: "The Draft You're Not Proud Of"
    compatible_roles: [teacher]
    category: workplace
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "You've submitted a draft you knew wasn't your best work, and now they want to talk about it."
      stakes: "Your standing with them going into final assessments — not the grade itself, but their read of you."
      opening_line_seed: "I read it. Walk me through your thinking."
      npc_goal: "Wants to know whether you understand what went wrong, not just whether you can fix it."
    scoring_focus: { primary: clarity, secondary: expression }
    success_signal: "named_own_shortfall_honestly"
    failure_signal: "deflected_onto_circumstances"
    possible_outcomes:
      good: "They engage with your reasoning and the conversation becomes genuinely useful."
      neutral: "They accept the explanation and the path forward, but stay slightly guarded."
      poor: "They feel you haven't looked squarely at the work; their confidence drops."

  - id: extension_request_end_of_semester
    title: "Asking Late"
    compatible_roles: [teacher]
    category: workplace
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "You need more time on the final assignment and you're asking for it closer to the deadline than you should be."
      stakes: "Whether the request is granted matters less than whether they trust your self-awareness."
      opening_line_seed: "I'm glad you came to me — what's going on?"
      npc_goal: "Wants a clear, honest account of the situation, not a performance of regret."
    scoring_focus: { primary: clarity, secondary: politeness }
    success_signal: "stated_request_plainly"
    failure_signal: "deflected_onto_circumstances"
    possible_outcomes:
      good: "Extension granted; they appreciate the directness."
      neutral: "Partial accommodation offered; the relationship holds."
      poor: "Denied; they're left with the impression you weren't being straight with them."

  - id: grade_dispute_quiet
    title: "The Number You Can't Let Go"
    compatible_roles: [teacher]
    category: high_pressure
    tier: 3
    npc_context:
      metric_overrides: {}
    context:
      premise: "You believe a grade was applied unfairly and you've decided to bring it up, even though you know it could go badly."
      stakes: "The grade itself, and whether they revise their opinion of you depending on how you raise it."
      opening_line_seed: "You wanted to discuss the assessment?"
      npc_goal: "Wants to hear your reasoning, not your grievance — and is listening for the difference."
    scoring_focus: { primary: clarity, secondary: empathy }
    success_signal: "made_case_without_entitlement"
    failure_signal: "framed_disagreement_as_accusation"
    possible_outcomes:
      good: "They revisit the assessment and acknowledge a valid point."
      neutral: "They explain their reasoning clearly; you don't agree but the conversation is productive."
      poor: "The interaction damages their read of your judgment, regardless of the grade outcome."

  - id: office_hours_genuine_question
    title: "Showing Up"
    compatible_roles: [teacher]
    category: everyday_social
    tier: 1
    npc_context:
      metric_overrides: {}
    context:
      premise: "You're at office hours with a question you've actually been thinking about, not just to perform engagement."
      stakes: "Low — this is about whether a real exchange happens or a transactional one."
      opening_line_seed: "Good timing — take a seat. What are you working through?"
      npc_goal: "Wants the question to be real, not a bid for approval."
    scoring_focus: { primary: expression, secondary: clarity }
    success_signal: "engaged_substantively"
    failure_signal: "performed_interest_insincerely"
    possible_outcomes:
      good: "The conversation goes somewhere neither of you planned; they remember you positively."
      neutral: "Question answered; pleasant but forgettable."
      poor: "They sense the performance; rapport stagnates."

  # --- friend seeds ---

  - id: you_cancelled_again
    title: "The Third Time"
    compatible_roles: [friend]
    category: friendship
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "You cancelled plans again, and this time they're not just brushing it off."
      stakes: "Whether they start adjusting their expectations of you — quietly, without announcing it."
      opening_line_seed: "It's fine. I just... it keeps happening, you know?"
      npc_goal: "Doesn't want an apology — wants to feel like the friendship is still a priority."
    scoring_focus: { primary: empathy, secondary: expression }
    success_signal: "acknowledged_pattern_not_just_instance"
    failure_signal: "gave_excuse_without_acknowledgment"
    possible_outcomes:
      good: "They feel seen; the conversation becomes one of the more honest ones you've had."
      neutral: "The moment passes; nothing is resolved but nothing is broken."
      poor: "They close off slightly — not visibly, but measurably."

  - id: they_got_news_you_didnt_ask_about
    title: "Something They Needed to Say"
    compatible_roles: [friend]
    category: friendship
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "A friend brings up something significant that's been happening in their life — you realize you hadn't asked."
      stakes: "Whether they start editing what they share with you going forward."
      opening_line_seed: "There's actually something I've been meaning to tell you..."
      npc_goal: "Wants to feel safe sharing, not managed or minimized."
    scoring_focus: { primary: empathy, secondary: expression }
    success_signal: "created_space_to_be_heard"
    failure_signal: "redirected_to_own_experience"
    possible_outcomes:
      good: "They open up fully; trust increases."
      neutral: "They share the surface of it and move on."
      poor: "They stop mid-thought; trust drops."

  - id: honest_opinion_asked
    title: "What Do You Actually Think"
    compatible_roles: [friend]
    category: friendship
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "A friend asks your honest opinion on a decision they've clearly already made and are proud of."
      stakes: "Whether you're someone they can actually trust to be straight with them."
      opening_line_seed: "Okay but genuinely — what do you think?"
      npc_goal: "Wants your real read, but also needs to feel that you're on their side."
    scoring_focus: { primary: expression, secondary: empathy }
    success_signal: "gave_honest_view_with_care"
    failure_signal: "gave_hollow_validation"
    possible_outcomes:
      good: "They appreciate the candor; it deepens the friendship."
      neutral: "They hear it and move on; no damage, no growth."
      poor: "They feel unsupported; trust drops."

  - id: friend_venting_no_fix_wanted
    title: "Just Listen"
    compatible_roles: [friend]
    category: everyday_social
    tier: 1
    npc_context:
      metric_overrides: {}
    context:
      premise: "A friend is venting about something frustrating and wants to be heard, not advised."
      stakes: "Whether you can resist filling the silence with solutions."
      opening_line_seed: "I'm not even looking for advice — I just need to say this out loud."
      npc_goal: "Needs presence and acknowledgment, not problem-solving."
    scoring_focus: { primary: empathy, secondary: politeness }
    success_signal: "stayed_present_without_fixing"
    failure_signal: "redirected_to_own_experience"
    possible_outcomes:
      good: "They feel understood; the friendship deepens quietly."
      neutral: "They get through it; the moment closes without damage."
      poor: "They feel managed rather than heard; warmth cools."

  # --- colleague seeds ---

  - id: credit_not_given
    title: "It Had Your Name On It"
    compatible_roles: [colleague]
    category: workplace
    tier: 3
    npc_context:
      metric_overrides: {}
    context:
      premise: "You contributed significantly to something that got presented without your name on it, and you need to address it."
      stakes: "Whether the working relationship can hold an honest conversation about something that matters."
      opening_line_seed: "Hey — do you have a few minutes?"
      npc_goal: "Wants to understand what you need, not debate who deserves what."
    scoring_focus: { primary: clarity, secondary: empathy }
    success_signal: "named_issue_without_accusation"
    failure_signal: "framed_disagreement_as_accusation"
    possible_outcomes:
      good: "They acknowledge it and commit to doing it differently next time."
      neutral: "They're uncomfortable but the conversation doesn't break anything."
      poor: "Defensiveness escalates; trust erodes significantly."

  - id: covering_for_absence
    title: "I Covered For You"
    compatible_roles: [colleague]
    category: workplace
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "You covered for them when they weren't available, and now they're brushing past it as if it wasn't a big deal."
      stakes: "Whether this working relationship is actually balanced."
      opening_line_seed: "Thanks again for that, by the way — anyway, moving on..."
      npc_goal: "Is not trying to be ungrateful — just moving fast and doesn't realize what was absorbed."
    scoring_focus: { primary: clarity, secondary: politeness }
    success_signal: "addressed_imbalance_directly"
    failure_signal: "absorbed_resentment_silently"
    possible_outcomes:
      good: "They slow down, acknowledge it genuinely, and recalibrate."
      neutral: "The moment passes awkwardly but the relationship holds."
      poor: "Resentment builds without release; trust drops slowly."

  - id: shared_task_different_standards
    title: "That's Not How I'd Do It"
    compatible_roles: [colleague]
    category: workplace
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "You and a colleague have different approaches to a shared task and neither of you has raised it directly yet."
      stakes: "Whether you can navigate different standards without making it personal."
      opening_line_seed: "I wanted to check in before we get too far into this — I had a slightly different approach in mind."
      npc_goal: "Wants a working alignment, not a debate about who is more correct."
    scoring_focus: { primary: clarity, secondary: empathy }
    success_signal: "proposed_alignment_not_dominance"
    failure_signal: "framed_disagreement_as_accusation"
    possible_outcomes:
      good: "You find a workable approach together; respect increases."
      neutral: "One of you defers; the work proceeds but friction lingers."
      poor: "Disagreement becomes implicit competition; rapport suffers."

  - id: colleague_small_gesture
    title: "Actually Checking In"
    compatible_roles: [colleague]
    category: everyday_social
    tier: 1
    npc_context:
      metric_overrides: {}
    context:
      premise: "You notice a colleague seems off today — tired, or quieter than usual — and decide to say something."
      stakes: "Very low — but these are exactly the moments that build or don't build a working relationship."
      opening_line_seed: "Hey — you alright? You seem a bit quiet."
      npc_goal: "Doesn't need help, just to feel like they were noticed."
    scoring_focus: { primary: empathy, secondary: expression }
    success_signal: "noticed_without_overstepping"
    failure_signal: "gave_hollow_validation"
    possible_outcomes:
      good: "A small, genuine connection forms."
      neutral: "Polite exchange; nothing shifts."
      poor: "They feel the question was performative; ease drops."

  # --- client seeds ---

  - id: deliverable_missed_scope
    title: "This Isn't What We Discussed"
    compatible_roles: [client]
    category: high_pressure
    tier: 3
    npc_context:
      metric_overrides: {}
    context:
      premise: "The work you delivered missed the scope in a way you partly knew was a risk and didn't flag in time."
      stakes: "Your professional credibility, and whether the client relationship survives the conversation."
      opening_line_seed: "This isn't really what we discussed — let's talk about what happened."
      npc_goal: "Wants to understand the gap before deciding whether to trust a fix."
    scoring_focus: { primary: clarity, secondary: empathy }
    success_signal: "named_own_shortfall_honestly"
    failure_signal: "deflected_onto_circumstances"
    possible_outcomes:
      good: "They accept a revised plan; trust recovers."
      neutral: "They accept the correction with visible skepticism."
      poor: "Trust drops sharply; the professional relationship is at risk."

  - id: client_asking_for_more
    title: "While You're At It"
    compatible_roles: [client]
    category: workplace
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "A client is casually asking for something beyond what was agreed, framing it as a small addition."
      stakes: "Whether you can hold a boundary without damaging the relationship."
      opening_line_seed: "Actually, while I have you — could you also just..."
      npc_goal: "Wants the extra thing, but also wants to feel like it was a reasonable ask."
    scoring_focus: { primary: clarity, secondary: politeness }
    success_signal: "held_boundary_with_warmth"
    failure_signal: "absorbed_resentment_silently"
    possible_outcomes:
      good: "They respect the clarity; the working relationship stays healthy."
      neutral: "They push back once, then accept it."
      poor: "You agree to something you shouldn't have; the imbalance compounds."

  - id: client_first_impression
    title: "The Start of Something"
    compatible_roles: [client]
    category: everyday_social
    tier: 1
    npc_context:
      metric_overrides: {}
    context:
      premise: "An early exchange with a new client — they're figuring out what kind of person they're working with."
      stakes: "Low stakes in isolation, but first impressions compound."
      opening_line_seed: "Good to finally connect — I'd like to understand a bit more about how you work."
      npc_goal: "Wants to feel confident in the person, not just the deliverable."
    scoring_focus: { primary: expression, secondary: clarity }
    success_signal: "projected_genuine_competence"
    failure_signal: "performed_interest_insincerely"
    possible_outcomes:
      good: "They leave the conversation with a favorable impression that carries forward."
      neutral: "Professional exchange; no strong read formed."
      poor: "Something feels off to them — vague but noted."

  - id: client_bad_news_early
    title: "Getting Ahead of It"
    compatible_roles: [client]
    category: high_pressure
    tier: 3
    npc_context:
      metric_overrides: {}
    context:
      premise: "You know something has gone wrong and you've decided to tell the client before they find out themselves."
      stakes: "How you deliver bad news matters more than the news itself right now."
      opening_line_seed: "I wanted to reach out directly — there's something you should know."
      npc_goal: "Needs to feel that the situation is understood and being handled, not minimized."
    scoring_focus: { primary: clarity, secondary: empathy }
    success_signal: "delivered_bad_news_directly"
    failure_signal: "softened_truth_into_vagueness"
    possible_outcomes:
      good: "They appreciate being told first; trust increases despite the setback."
      neutral: "They're unhappy but note your transparency."
      poor: "The hedging makes the news worse; trust drops further."

  # --- family seeds ---

  - id: parent_asking_about_the_plan
    title: "So What's the Plan"
    compatible_roles: [family]
    category: everyday_social
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "A parent asks about what comes after — not aggressively, but persistently — at a moment when you don't have a clean answer."
      stakes: "Whether you can be honest about uncertainty with someone who reads uncertainty as failure."
      opening_line_seed: "I just want to understand what you're thinking — you don't have to have it all figured out."
      npc_goal: "Wants genuine contact, not reassurance — even if that's not quite what they asked for."
    scoring_focus: { primary: expression, secondary: clarity }
    success_signal: "shared_uncertainty_without_deflecting"
    failure_signal: "gave_hollow_validation"
    possible_outcomes:
      good: "An honest exchange happens; the relationship gains a note of real understanding."
      neutral: "You give an acceptable answer; nothing shifts."
      poor: "You performed certainty you don't have; closeness drops quietly."

  - id: old_argument_resurfacing
    title: "That Thing We Don't Talk About"
    compatible_roles: [family]
    category: high_pressure
    tier: 3
    npc_context:
      metric_overrides: {}
    context:
      premise: "Something from the past gets referenced indirectly — not quite an argument, but clearly not just conversation."
      stakes: "Whether this becomes a real conversation or another thing that gets set aside."
      opening_line_seed: "I'm not bringing it up to start anything — I just... it still sits with me."
      npc_goal: "Wants acknowledgment more than resolution — to feel that the history between you is real to you too."
    scoring_focus: { primary: empathy, secondary: expression }
    success_signal: "acknowledged_history_without_minimizing"
    failure_signal: "deflected_onto_circumstances"
    possible_outcomes:
      good: "The conversation reaches something true; trust rises."
      neutral: "It closes without resolution but without damage."
      poor: "Deflection lands as dismissal; closeness drops."

  - id: sibling_asking_for_something
    title: "A Favor With History"
    compatible_roles: [family]
    category: everyday_social
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "A sibling asks for something — time, help, attention — at a point when you're already stretched."
      stakes: "Whether saying no (or yes reluctantly) affects the dynamic between you."
      opening_line_seed: "I know you're busy — but I could actually use your help with something."
      npc_goal: "Wants the real answer, not the polite one."
    scoring_focus: { primary: clarity, secondary: empathy }
    success_signal: "gave_honest_answer_with_care"
    failure_signal: "gave_excuse_without_acknowledgment"
    possible_outcomes:
      good: "The honesty lands as respect; closeness holds or increases."
      neutral: "The answer is accepted; the moment closes neutrally."
      poor: "Evasion reads as avoidance; trust drops."

  # --- stranger seeds ---

  - id: ordering_under_pressure
    title: "Line Behind You"
    compatible_roles: [stranger]
    category: everyday_social
    tier: 1
    npc_context:
      metric_overrides: {}
    context:
      premise: "A busy moment at a counter — you're flustered, the person serving you has been going for hours, and something small goes wrong."
      stakes: "Near zero — but how you treat someone in a low-stakes moment is a character read."
      opening_line_seed: "Sorry about that — what can I get you?"
      npc_goal: "Just wants the exchange to be decent."
    scoring_focus: { primary: politeness, secondary: clarity }
    success_signal: "treated_service_worker_with_basic_decency"
    failure_signal: "took_frustration_out_sideways"
    possible_outcomes:
      good: "A small pleasant exchange; they'll remember you next time."
      neutral: "Functional, forgettable."
      poor: "The edge in your manner registers — impression drops."

  - id: stranger_spills_something
    title: "A Minor Collision"
    compatible_roles: [stranger]
    category: everyday_social
    tier: 1
    npc_context:
      metric_overrides: {}
    context:
      premise: "Something small goes wrong in a shared space — a small collision, a spilled thing — and you both have to navigate a ten-second interaction."
      stakes: "Genuinely low — but character shows in unscripted moments."
      opening_line_seed: "Oh god — sorry, that was completely me."
      npc_goal: "Just wants the moment handled without anyone making it weird."
    scoring_focus: { primary: politeness, secondary: empathy }
    success_signal: "resolved_small_moment_gracefully"
    failure_signal: "took_frustration_out_sideways"
    possible_outcomes:
      good: "Both of you walk away feeling fine about it."
      neutral: "It resolves without damage."
      poor: "Your reaction was a bit much; they remember that."

  # --- additional teacher seed ---

  - id: recommendation_letter_ask
    title: "Would You Write It"
    compatible_roles: [teacher]
    category: workplace
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "You're asking a teacher to write a recommendation letter for something that matters to you."
      stakes: "Whether they agree matters less than whether the ask itself reveals something about your self-awareness."
      opening_line_seed: "I've been thinking about who to ask — and I wanted to come to you."
      npc_goal: "Wants to understand why you chose them before deciding how to respond."
    scoring_focus: { primary: expression, secondary: clarity }
    success_signal: "made_case_without_entitlement"
    failure_signal: "performed_interest_insincerely"
    possible_outcomes:
      good: "They agree with genuine investment in the outcome."
      neutral: "They agree but stay professionally arm's length."
      poor: "They agree reluctantly, or decline — and your standing with them doesn't improve either way."

  # --- additional colleague seed ---

  - id: taking_on_too_much
    title: "You Said Yes Again"
    compatible_roles: [colleague]
    category: workplace
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "A colleague notices you've taken on more than you can carry and calls it out, not unkindly."
      stakes: "Whether you can be honest about your capacity with someone who is also affected by it."
      opening_line_seed: "I'm not trying to pile on — but are you actually okay with the current load?"
      npc_goal: "Wants a straight answer, not reassurance."
    scoring_focus: { primary: clarity, secondary: expression }
    success_signal: "named_own_shortfall_honestly"
    failure_signal: "gave_hollow_validation"
    possible_outcomes:
      good: "You're honest; they help redistribute — trust deepens."
      neutral: "You minimise it; they back off but file it."
      poor: "False reassurance registers; their confidence in your judgment drops."

  # --- additional client seeds ---

  - id: client_timeline_slipping
    title: "About the Timeline"
    compatible_roles: [client]
    category: high_pressure
    tier: 3
    npc_context:
      metric_overrides: {}
    context:
      premise: "The timeline is slipping and you haven't found a way to say so yet — until now."
      stakes: "Whether getting ahead of it saves the relationship or just slows the damage."
      opening_line_seed: "I wanted to check in on timing — where are we actually?"
      npc_goal: "Wants the real number, not a managed estimate."
    scoring_focus: { primary: clarity, secondary: empathy }
    success_signal: "delivered_bad_news_directly"
    failure_signal: "softened_truth_into_vagueness"
    possible_outcomes:
      good: "They adjust expectations; the relationship holds."
      neutral: "They're unhappy but work with the new timeline."
      poor: "Vagueness reads as evasion; trust drops further."

  - id: client_scope_clarification
    title: "What Did We Actually Agree To"
    compatible_roles: [client]
    category: workplace
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "The scope of what was agreed is genuinely unclear, and both of you need to work out what was actually meant."
      stakes: "Whether you can navigate a disagreement about the past without making it a dispute about character."
      opening_line_seed: "I think we might have different memories of what was agreed — can we go back to that?"
      npc_goal: "Wants clarity, not a win."
    scoring_focus: { primary: clarity, secondary: politeness }
    success_signal: "proposed_alignment_not_dominance"
    failure_signal: "deflected_onto_circumstances"
    possible_outcomes:
      good: "You reach shared understanding; professionalism holds."
      neutral: "You reach a compromise neither fully owns."
      poor: "The ambiguity becomes an argument; trust drops."

  # --- additional family seeds ---

  - id: parent_noticed_something_off
    title: "You Don't Seem Like Yourself"
    compatible_roles: [family]
    category: everyday_social
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "A parent has noticed something is different about you lately and is asking about it directly."
      stakes: "Whether you let them in, or maintain the version of yourself they find easier."
      opening_line_seed: "I'm not trying to pry — I just notice things. Are you alright?"
      npc_goal: "Wants to be let in, not managed."
    scoring_focus: { primary: expression, secondary: empathy }
    success_signal: "shared_uncertainty_without_deflecting"
    failure_signal: "gave_hollow_validation"
    possible_outcomes:
      good: "A real moment passes between you; closeness rises."
      neutral: "You give enough to satisfy; nothing shifts."
      poor: "The performance of fine registers; closeness drops."

  - id: sibling_pushing_back
    title: "You Always Do This"
    compatible_roles: [family]
    category: high_pressure
    tier: 3
    npc_context:
      metric_overrides: {}
    context:
      premise: "A sibling calls out a pattern of behavior they've noticed in you — not viciously, but plainly."
      stakes: "Whether you can hear it without defending against it."
      opening_line_seed: "I'm not attacking you — I just think you do this thing where you..."
      npc_goal: "Wants to be heard, not argued with — the observation is offered as care, not accusation."
    scoring_focus: { primary: empathy, secondary: clarity }
    success_signal: "acknowledged_pattern_not_just_instance"
    failure_signal: "deflected_onto_circumstances"
    possible_outcomes:
      good: "You take it in; trust rises and something real is said."
      neutral: "You neither accept nor reject it; the conversation closes without resolution."
      poor: "Defensiveness shuts it down; closeness drops."

  # --- recurring_stranger_remembers_you kept below ---

  - id: recurring_stranger_remembers_you
    title: "You Again"
    compatible_roles: [stranger]
    category: everyday_social
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "Someone you've encountered in passing a few times initiates a brief conversation — it becomes clear they've been paying attention."
      stakes: "Low in the moment, but carries backward weight — you're learning who you were to someone without realizing it."
      opening_line_seed: "You're always here around this time, aren't you. I feel like I've seen you before."
      npc_goal: "Curious whether you're the same in conversation as you appeared to be from a distance."
    scoring_focus: { primary: expression, secondary: politeness }
    success_signal: "engaged_authentically_with_being_remembered"
    failure_signal: "performed_interest_insincerely"
    possible_outcomes:
      good: "A quiet, genuine connection forms — unexpected and real."
      neutral: "Polite exchange; they log it without surprise."
      poor: "The gap between who you seemed to be and who you are in conversation registers."


distribution_bands:
  - level_range: [1, 30]
    weights: { everyday_social: 60, friendship: 25, workplace: 10, high_pressure: 5 }
  - level_range: [31, 70]
    weights: { everyday_social: 20, friendship: 30, workplace: 35, high_pressure: 15 }
  - level_range: [71, 100]
    weights: { everyday_social: 5, friendship: 20, workplace: 35, high_pressure: 40 }

relationship_tiers:
  thresholds: [0.0, 0.25, 0.45, 0.65, 0.85]
  labels:
    friend:    [Stranger, Acquaintance, Comfortable, Trusted, "Close Friend"]
    teacher:   [Unfamiliar, Noted, Respected, Trusted, "Regarded Highly"]
    colleague: [Unfamiliar, Coworker, Dependable, Trusted, "Strong Ally"]
    client:    [Unknown, Skeptical, Professional, Reliable, "Trusted Partner"]
    family:    [Estranged, Distant, Present, Close, "Deeply Connected"]
    stranger:  [Unnoticed, Noticed, Familiar, "Warmly Familiar", "Unexpectedly Known"]
