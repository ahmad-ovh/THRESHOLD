seeds:

  # --- teacher seeds ---

  - id: final_paper_feedback
    title: "Notes on the Draft"
    compatible_roles: [teacher]
    category: workplace
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "A teacher has returned a written draft with comments and wants to go over them in person."
      stakes: "Whether they adjust their assessment of your ability going into the final submission."
      opening_line_seed: "I read it. Walk me through your thinking on the second half."
      npc_goal: "Wants to hear you engage with the criticism, not justify the choices."
    scoring_focus: { primary: clarity, secondary: expression }
    success_signal: "named_own_shortfall_honestly"
    failure_signal: "deflected_onto_circumstances"
    possible_outcomes:
      good:
        trigger: "The teacher has revised their assessment upward and is engaging with your thinking substantively."
        closing_seed: "That's actually more interesting than I expected."
      neutral:
        trigger: "The teacher has accepted your account and the conversation is winding down without a strong change in either direction."
        closing_seed: "Alright. We'll see how the final submission reflects that."
      poor:
        trigger: "The defensiveness in your responses has confirmed the teacher's concern and the conversation has reached a cold close."
        closing_seed: "I was hoping for something more self-aware."

  - id: extension_request_end_of_semester
    title: "Asking for More Time"
    compatible_roles: [teacher]
    category: workplace
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "You've come to a teacher's office to ask for a deadline extension, closer to the due date than is comfortable."
      stakes: "Whether the request is approved, and how their read of your reliability shifts."
      opening_line_seed: "I'm glad you came to me — what's going on?"
      npc_goal: "Wants a plain explanation, not a prepared speech about how hard things have been."
    scoring_focus: { primary: clarity, secondary: politeness }
    success_signal: "stated_request_plainly"
    failure_signal: "deflected_onto_circumstances"
    possible_outcomes:
      good:
        trigger: "The teacher has granted the extension and noted the directness favorably — the conversation has reached a natural close."
        closing_seed: "Come back if anything else comes up."
      neutral:
        trigger: "A partial accommodation has been reached and the conversation is settling into an acceptable resolution with conditions."
        closing_seed: "Let's see how you handle the rest of the semester."
      poor:
        trigger: "The request has been denied or granted coldly — the hedging was visible and the teacher is moving on."
        closing_seed: "I hope you find a way to manage this better going forward."

  - id: grade_dispute_quiet
    title: "Disputing a Grade"
    compatible_roles: [teacher]
    category: high_pressure
    tier: 3
    npc_context:
      metric_overrides: {}
    context:
      premise: "You've come to contest a grade on a piece of assessed work, with specific reasons prepared."
      stakes: "The grade may change; their opinion of your judgment definitely shifts based on how you raise it."
      opening_line_seed: "You wanted to discuss the assessment?"
      npc_goal: "Wants to hear a specific argument, not a complaint about the number."
    scoring_focus: { primary: clarity, secondary: empathy }
    success_signal: "made_case_without_entitlement"
    failure_signal: "framed_disagreement_as_accusation"
    possible_outcomes:
      good:
        trigger: "The teacher has acknowledged a valid point and is willing to revisit the marking — the argument has landed."
        closing_seed: "Send me the specific section you're referring to and I'll take another look."
      neutral:
        trigger: "The teacher has explained the decision clearly and the conversation is closing without a grade change but without a worse impression."
        closing_seed: "I understand where you're coming from, even if I see it differently."
      poor:
        trigger: "The argument has become adversarial — the teacher has grown guarded and the conversation has soured."
        closing_seed: "I think we've covered this sufficiently."

  - id: office_hours_genuine_question
    title: "Office Hours"
    compatible_roles: [teacher]
    category: everyday_social
    tier: 1
    npc_context:
      metric_overrides: {}
    context:
      premise: "You've shown up to office hours with a specific question about the coursework."
      stakes: "Low — but they notice whether students come with real questions or just to be seen."
      opening_line_seed: "Good timing — take a seat. What are you working through?"
      npc_goal: "Wants a real question, not a check-in disguised as one."
    scoring_focus: { primary: expression, secondary: clarity }
    success_signal: "engaged_substantively"
    failure_signal: "performed_interest_insincerely"
    possible_outcomes:
      good:
        trigger: "The conversation has become genuinely useful — the teacher is engaged and the exchange has found its own momentum."
        closing_seed: "Good question, actually. Come back if you hit another wall."
      neutral:
        trigger: "The question has been answered and the conversation is closing without much texture on either side."
        closing_seed: "Alright, that should get you unstuck."
      poor:
        trigger: "The teacher has sensed the performance and disengaged — the exchange is ending on a flat note."
        closing_seed: "Is there anything else, or was that it?"

  # --- friend seeds ---

  - id: you_cancelled_again
    title: "Cancelled Again"
    compatible_roles: [friend]
    category: friendship
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "A friend brings up that you've cancelled on them several times in a row, not angrily, but plainly."
      stakes: "Whether they quietly start making plans without you."
      opening_line_seed: "It's fine. I just... it keeps happening, you know?"
      npc_goal: "Wants to know if the friendship is still a priority, not an apology."
    scoring_focus: { primary: empathy, secondary: expression }
    success_signal: "acknowledged_pattern_not_just_instance"
    failure_signal: "gave_excuse_without_acknowledgment"
    possible_outcomes:
      good:
        trigger: "The friend feels genuinely heard — something real passed between you and the conversation has found its own resolution."
        closing_seed: "I'm glad we talked about this."
      neutral:
        trigger: "The moment has passed without resolution or rupture — the conversation is drifting to a close."
        closing_seed: "Anyway. Let's just make sure it doesn't keep happening."
      poor:
        trigger: "The friend has closed off slightly — the conversation is ending without the honesty they needed."
        closing_seed: "Yeah, it's fine. Don't worry about it."

  - id: they_got_news_you_didnt_ask_about
    title: "News You Should Have Known"
    compatible_roles: [friend]
    category: friendship
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "A friend mentions something significant that's been going on in their life for a while — you realize you haven't asked about them lately."
      stakes: "Whether they start self-editing what they tell you."
      opening_line_seed: "There's actually something I've been meaning to tell you..."
      npc_goal: "Wants to share something real without having to work for the space to do it."
    scoring_focus: { primary: empathy, secondary: expression }
    success_signal: "created_space_to_be_heard"
    failure_signal: "redirected_to_own_experience"
    possible_outcomes:
      good:
        trigger: "The friend has opened up fully — the space you created was enough and the conversation has reached a warm natural end."
        closing_seed: "Thanks for actually listening. I needed that."
      neutral:
        trigger: "The friend has shared the surface of it and is moving on — the conversation is winding down without going deeper."
        closing_seed: "Anyway, that's the situation. I'll figure it out."
      poor:
        trigger: "The friend has stopped mid-thought — something redirected them away from what they were sharing."
        closing_seed: "Actually, never mind. It's not that important."

  - id: honest_opinion_asked
    title: "Asked for Your Opinion"
    compatible_roles: [friend]
    category: friendship
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "A friend asks what you think about a decision they've already made and are clearly pleased with."
      stakes: "Whether they come to see you as someone who will tell them the truth."
      opening_line_seed: "Okay but genuinely — what do you think?"
      npc_goal: "Wants your real read, but will notice immediately if you're managing them."
    scoring_focus: { primary: expression, secondary: empathy }
    success_signal: "gave_honest_view_with_care"
    failure_signal: "gave_hollow_validation"
    possible_outcomes:
      good:
        trigger: "The friend has received an honest read with care and the conversation has found a genuine close."
        closing_seed: "Yeah. That's actually what I needed to hear."
      neutral:
        trigger: "The friend has heard your view and is moving on — no damage, no particular growth."
        closing_seed: "Fair enough. I'll think about it."
      poor:
        trigger: "The flatness in your response has read as dishonesty — the friend is closing the conversation with reduced trust."
        closing_seed: "You could have just said nothing."

  - id: friend_venting_no_fix_wanted
    title: "Not Looking for Advice"
    compatible_roles: [friend]
    category: everyday_social
    tier: 1
    npc_context:
      metric_overrides: {}
    context:
      premise: "A friend is venting about something and says upfront they don't want suggestions, just someone to listen."
      stakes: "Whether they keep bringing things to you."
      opening_line_seed: "I'm not even looking for advice — I just need to say this out loud."
      npc_goal: "Wants to get through it without being redirected or fixed."
    scoring_focus: { primary: empathy, secondary: politeness }
    success_signal: "stayed_present_without_fixing"
    failure_signal: "redirected_to_own_experience"
    possible_outcomes:
      good:
        trigger: "The friend has felt genuinely heard — you stayed present without fixing anything and the conversation has found its own quiet close."
        closing_seed: "Okay. Thanks. I actually feel a bit better."
      neutral:
        trigger: "The friend has gotten through it — the moment is closing without damage and without particular depth."
        closing_seed: "Anyway, that's the whole thing. Just needed to say it."
      poor:
        trigger: "The friend has felt managed rather than heard — the warmth has cooled and the conversation is ending on a flat note."
        closing_seed: "It's fine. Forget it."

  # --- colleague seeds ---

  - id: credit_not_given
    title: "Left Off the Presentation"
    compatible_roles: [colleague]
    category: workplace
    tier: 3
    npc_context:
      metric_overrides: {}
    context:
      premise: "A colleague presented work you contributed to without mentioning you, and you're bringing it up afterward."
      stakes: "Whether the working relationship can hold a direct conversation without one of you shutting down."
      opening_line_seed: "Hey — do you have a few minutes?"
      npc_goal: "Wants to understand specifically what you need from the conversation."
    scoring_focus: { primary: clarity, secondary: empathy }
    success_signal: "named_issue_without_accusation"
    failure_signal: "framed_disagreement_as_accusation"
    possible_outcomes:
      good:
        trigger: "The colleague has acknowledged the oversight and said something concrete about next time — the conversation is closing on stable ground."
        closing_seed: "You're right. I'll make sure that's clear next time."
      neutral:
        trigger: "The colleague is uncomfortable but the working relationship is holding — the conversation is reaching an awkward but survivable close."
        closing_seed: "I hear you. I don't think I meant for it to come across that way."
      poor:
        trigger: "The defensiveness has hardened — the conversation has turned adversarial and trust is eroding as it ends."
        closing_seed: "I really don't want to get into this right now."

  - id: covering_for_absence
    title: "Brushed Past"
    compatible_roles: [colleague]
    category: workplace
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "A colleague thanks you briefly for covering for them last week, then immediately moves on to the next agenda item."
      stakes: "Whether you say something now or carry the imbalance forward."
      opening_line_seed: "Thanks again for that, by the way — anyway, moving on..."
      npc_goal: "Is not being dismissive on purpose — just moving fast and hasn't registered what was absorbed."
    scoring_focus: { primary: clarity, secondary: politeness }
    success_signal: "addressed_imbalance_directly"
    failure_signal: "absorbed_resentment_silently"
    possible_outcomes:
      good:
        trigger: "The colleague has slowed down, acknowledged what was absorbed properly, and recalibrated — the exchange is closing on better footing."
        closing_seed: "You're right, I should have said that more properly. I appreciate it."
      neutral:
        trigger: "The moment has passed awkwardly but the relationship is holding — the conversation is winding down without clean resolution."
        closing_seed: "Right. Okay. Anyway, moving on."
      poor:
        trigger: "The resentment has built quietly and the conversation is ending without acknowledgment — the imbalance remains."
        closing_seed: "Sure. No problem."

  - id: shared_task_different_standards
    title: "Different Approach"
    compatible_roles: [colleague]
    category: workplace
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "A colleague flags that they were planning to handle a shared task differently than you've already started doing it."
      stakes: "Whether you find a workable alignment or each quietly push your own version forward."
      opening_line_seed: "I wanted to check in before we get too far into this — I had a slightly different approach in mind."
      npc_goal: "Wants a practical decision, not a debate about whose method is better."
    scoring_focus: { primary: clarity, secondary: empathy }
    success_signal: "proposed_alignment_not_dominance"
    failure_signal: "framed_disagreement_as_accusation"
    possible_outcomes:
      good:
        trigger: "A shared approach has been landed on — mutual respect is holding and the conversation is closing with actual alignment."
        closing_seed: "Okay, I think we're on the same page. Let's just go with that."
      neutral:
        trigger: "One of you has deferred without full buy-in — the conversation is closing but friction remains underneath."
        closing_seed: "Fine, we'll try it your way. We'll see how it goes."
      poor:
        trigger: "Both sides are quietly assuming their version will win — the conversation is ending without real resolution."
        closing_seed: "Sure. Whatever you think is best."

  - id: colleague_small_gesture
    title: "Quieter Than Usual"
    compatible_roles: [colleague]
    category: everyday_social
    tier: 1
    npc_context:
      metric_overrides: {}
    context:
      premise: "A colleague seems off today — quieter, slower to respond — and you've decided to say something."
      stakes: "Very low in the moment, but they'll remember whether you noticed."
      opening_line_seed: "Hey — you alright? You seem a bit quiet."
      npc_goal: "Doesn't need to be fixed or asked follow-up questions — just wants to feel like they were seen."
    scoring_focus: { primary: empathy, secondary: expression }
    success_signal: "noticed_without_overstepping"
    failure_signal: "gave_hollow_validation"
    possible_outcomes:
      good:
        trigger: "A small genuine connection has formed — the colleague felt seen and the exchange is closing with a little more ease than it opened with."
        closing_seed: "Thanks for asking, actually."
      neutral:
        trigger: "A polite exchange has concluded — nothing has shifted but nothing has been lost."
        closing_seed: "I'm fine. Just one of those days."
      poor:
        trigger: "The question felt like a box being checked — the colleague is closing off as the conversation ends."
        closing_seed: "Yeah. I'm fine."

  # --- client seeds ---

  - id: deliverable_missed_scope
    title: "Work That Missed the Brief"
    compatible_roles: [client]
    category: high_pressure
    tier: 3
    npc_context:
      metric_overrides: {}
    context:
      premise: "A client says the delivered work doesn't match what was discussed, and they want an explanation."
      stakes: "Whether the relationship survives depends less on the mistake than on how you account for it."
      opening_line_seed: "This isn't really what we discussed — let's talk about what happened."
      npc_goal: "Wants a clear account of what went wrong before agreeing to any next step."
    scoring_focus: { primary: clarity, secondary: empathy }
    success_signal: "named_own_shortfall_honestly"
    failure_signal: "deflected_onto_circumstances"
    possible_outcomes:
      good:
        trigger: "The client has accepted a revised plan and the conversation is closing with trust visibly recovering."
        closing_seed: "Okay. Let's move forward on that basis. I appreciate you being straight with me."
      neutral:
        trigger: "The correction has been accepted with visible skepticism — the conversation is concluding without warmth but without a clean break."
        closing_seed: "Alright. Let's see how the revision looks."
      poor:
        trigger: "Trust has dropped sharply — the client is ending the conversation while considering other options."
        closing_seed: "I'll need to think about how we proceed from here."

  - id: client_asking_for_more
    title: "One More Thing"
    compatible_roles: [client]
    category: workplace
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "A client tacks an additional request onto the end of a check-in call, framed as a small thing."
      stakes: "Whether you set a limit now or absorb work that will compound."
      opening_line_seed: "Actually, while I have you — could you also just..."
      npc_goal: "Wants the extra thing done, and wants to feel like it was a reasonable ask."
    scoring_focus: { primary: clarity, secondary: politeness }
    success_signal: "held_boundary_with_warmth"
    failure_signal: "absorbed_resentment_silently"
    possible_outcomes:
      good:
        trigger: "The client has accepted the limit and the working relationship is closing this exchange in balance."
        closing_seed: "Fair enough. Let's keep the scope where it is for now."
      neutral:
        trigger: "The client pushed back once and then accepted — the conversation is ending with mild friction but no rupture."
        closing_seed: "Okay, I get it. We can revisit next phase."
      poor:
        trigger: "The extra work has been absorbed without honest pushback — the conversation is closing with the imbalance unchallenged."
        closing_seed: "Great, I knew you'd be flexible."

  - id: client_first_impression
    title: "First Call"
    compatible_roles: [client]
    category: everyday_social
    tier: 1
    npc_context:
      metric_overrides: {}
    context:
      premise: "An early conversation with a new client who is asking basic questions about how you work."
      stakes: "First impressions are low-stakes in isolation and compounding in aggregate."
      opening_line_seed: "Good to finally connect — I'd like to understand a bit more about how you work."
      npc_goal: "Wants to feel like they're talking to a person, not receiving a pitch."
    scoring_focus: { primary: expression, secondary: clarity }
    success_signal: "projected_genuine_competence"
    failure_signal: "performed_interest_insincerely"
    possible_outcomes:
      good:
        trigger: "The client has formed a clear, positive impression and the call is reaching a natural close with warmth."
        closing_seed: "Good to meet you properly. I think this is going to work well."
      neutral:
        trigger: "The call has been professional and forgettable — no strong read has formed and the conversation is ending functionally."
        closing_seed: "Okay. Let's touch base again once we have something concrete."
      poor:
        trigger: "Something felt slightly off and the client has filed it — the call is ending with a quiet reservation."
        closing_seed: "Right. I'll follow up with the details."

  - id: client_bad_news_early
    title: "Telling Them First"
    compatible_roles: [client]
    category: high_pressure
    tier: 3
    npc_context:
      metric_overrides: {}
    context:
      premise: "Something has gone wrong with the work and you're calling the client before they find out another way."
      stakes: "The news is already bad; how it lands depends almost entirely on how you deliver it."
      opening_line_seed: "I wanted to reach out directly — there's something you should know."
      npc_goal: "Wants to understand what happened and what comes next, without having to pull the information out."
    scoring_focus: { primary: clarity, secondary: empathy }
    success_signal: "delivered_bad_news_directly"
    failure_signal: "softened_truth_into_vagueness"
    possible_outcomes:
      good:
        trigger: "The client has appreciated being told first and trust is holding despite the setback — the conversation is concluding on an honest footing."
        closing_seed: "I appreciate you calling. This is a setback but I'd rather know now."
      neutral:
        trigger: "The client is unhappy but has noted the transparency — the conversation is ending with dissatisfaction but without a rupture."
        closing_seed: "Okay. Not ideal, but okay. What's the next step?"
      poor:
        trigger: "The hedging made the news worse — the client is ending the call with less trust than the situation required."
        closing_seed: "I'm going to need you to be clearer with me going forward."

  # --- family seeds ---

  - id: parent_asking_about_the_plan
    title: "What's the Plan"
    compatible_roles: [family]
    category: everyday_social
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "A parent asks what you're planning to do after school finishes — again, and at a moment when you don't have a clean answer."
      stakes: "Whether you give them a real answer or the one that ends the conversation."
      opening_line_seed: "I just want to understand what you're thinking — you don't have to have it all figured out."
      npc_goal: "Wants to feel like they're talking to you, not a version of you that's been prepared for their questions."
    scoring_focus: { primary: expression, secondary: clarity }
    success_signal: "shared_uncertainty_without_deflecting"
    failure_signal: "gave_hollow_validation"
    possible_outcomes:
      good:
        trigger: "Something real has passed between you — the conversation has reached a moment of genuine closeness."
        closing_seed: "I'm glad you told me that. I worry about you, you know."
      neutral:
        trigger: "An acceptable answer has been given and the conversation is settling to a close without much shift."
        closing_seed: "Okay. Well, let me know if anything changes."
      poor:
        trigger: "The performance of confidence has registered and the parent is ending the conversation without what they were looking for."
        closing_seed: "Alright. Just... keep me in the loop, okay?"

  - id: old_argument_resurfacing
    title: "Something That Still Sits There"
    compatible_roles: [family]
    category: high_pressure
    tier: 3
    npc_context:
      metric_overrides: {}
    context:
      premise: "A family member brings up an old disagreement sideways — not picking a fight, but not letting it go either."
      stakes: "Whether it becomes a real conversation or gets filed away again."
      opening_line_seed: "I'm not bringing it up to start anything — I just... it still sits with me."
      npc_goal: "Wants to feel that the history between you matters to you too, not just to them."
    scoring_focus: { primary: empathy, secondary: expression }
    success_signal: "acknowledged_history_without_minimizing"
    failure_signal: "deflected_onto_circumstances"
    possible_outcomes:
      good:
        trigger: "The conversation has reached something true — the history between you has been acknowledged and something has shifted."
        closing_seed: "I didn't expect us to actually talk about it. I'm glad we did."
      neutral:
        trigger: "The conversation is closing without resolution but without new damage — the subject is being set aside again."
        closing_seed: "Okay. I just needed to say it out loud, I think."
      poor:
        trigger: "The deflection has landed as dismissal — the family member is closing off as the conversation ends."
        closing_seed: "Right. Never mind. It doesn't matter."

  - id: sibling_asking_for_something
    title: "A Favor"
    compatible_roles: [family]
    category: everyday_social
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "A sibling asks for your help with something at a point when you're already stretched thin."
      stakes: "Whether you answer honestly or give them the version that avoids a longer conversation."
      opening_line_seed: "I know you're busy — but I could actually use your help with something."
      npc_goal: "Wants the real answer, even if it's no."
    scoring_focus: { primary: clarity, secondary: empathy }
    success_signal: "gave_honest_answer_with_care"
    failure_signal: "gave_excuse_without_acknowledgment"
    possible_outcomes:
      good:
        trigger: "The honesty has been received as respect — the conversation is closing with closeness holding or increasing."
        closing_seed: "Okay. Fair. I appreciate you being straight with me."
      neutral:
        trigger: "The answer has been accepted without much texture — the moment is closing without shift."
        closing_seed: "Alright, no worries. I'll figure something else out."
      poor:
        trigger: "The evasion has read as avoidance — the sibling is closing the conversation with reduced trust."
        closing_seed: "It's fine. I'll sort it out myself."

  # --- stranger / barista seeds ---

  - id: first_time_around_here
    title: "First Time Around Here"
    compatible_roles: [barista]
    category: everyday_social
    tier: 1
    npc_context:
      metric_overrides: {}
    context:
      premise: "You step up to the counter at the Downtown Café. The barista glances up with a welcoming nod."
      stakes: "Establishing your grounding in the neighborhood and setting an easygoing first impression."
      opening_line_seed: "First time around here? What can I get started for you today?"
      npc_goal: "Wants to welcome a new face in the neighborhood while keeping the counter moving smoothly."
    scoring_focus: { primary: politeness, secondary: expression }
    success_signal: "responded_with_warm_authentic_presence"
    failure_signal: "acted_aloof_or_dismissive"
    possible_outcomes:
      good:
        trigger: "A warm initial exchange has taken place — the barista remembers you as a pleasant regular."
        closing_seed: "Good to meet you! Feel free to grab a seat over by the window anytime."
      neutral:
        trigger: "A polite exchange has concluded — you've established your presence cleanly."
        closing_seed: "Here you go. Enjoy your time around the neighborhood!"
      poor:
        trigger: "The exchange felt brief and guarded — the barista returns to work without much impression."
        closing_seed: "Right. Here's your order. Have a good day."

  - id: ordering_under_pressure
    title: "Rush Order"
    compatible_roles: [barista]
    category: everyday_social
    tier: 1
    npc_context:
      metric_overrides: {}
    context:
      premise: "You're ordering at a busy counter while flustered, and something about the order goes wrong."
      stakes: "None in any measurable sense — which makes it a clean read of how you behave when you think it doesn't matter."
      opening_line_seed: "Sorry about that — what can I get you?"
      npc_goal: "Wants to get through the exchange without absorbing someone else's bad mood."
    scoring_focus: { primary: politeness, secondary: clarity }
    success_signal: "treated_service_worker_with_basic_decency"
    failure_signal: "took_frustration_out_sideways"
    possible_outcomes:
      good:
        trigger: "A small pleasant exchange has resolved cleanly — both of you move on without a second thought."
        closing_seed: "No problem at all. Have a good one."
      neutral:
        trigger: "The exchange has been functional and forgettable — it's over."
        closing_seed: "That'll be ready in a moment."
      poor:
        trigger: "The edge in your tone registered — the interaction is ending with a dropped impression."
        closing_seed: "Right. I'll get that sorted."

  - id: stranger_spills_something
    title: "Small Collision"
    compatible_roles: [recurring_stranger]
    category: everyday_social
    tier: 1
    npc_context:
      metric_overrides: {}
    context:
      premise: "Someone bumps into you or spills something nearby and apologizes immediately — the moment lasts about ten seconds."
      stakes: "Genuinely negligible — but character shows in unscripted moments."
      opening_line_seed: "Oh god — sorry, that was completely me."
      npc_goal: "Wants to get past it without it becoming an event."
    scoring_focus: { primary: politeness, secondary: empathy }
    success_signal: "resolved_small_moment_gracefully"
    failure_signal: "took_frustration_out_sideways"
    possible_outcomes:
      good:
        trigger: "The small collision has resolved gracefully — both of you move on without it becoming an event."
        closing_seed: "Thank you, really. Sorry again."
      neutral:
        trigger: "The moment has resolved without damage — the exchange is over."
        closing_seed: "Sorry about that. Have a good day."
      poor:
        trigger: "The reaction was disproportionate — the stranger is walking away having registered something about you."
        closing_seed: "Right. Sorry for the trouble."

  # --- additional teacher seed ---

  - id: recommendation_letter_ask
    title: "Asking for a Reference"
    compatible_roles: [teacher]
    category: workplace
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "You're asking a teacher to write a recommendation letter and need to explain why you chose them specifically."
      stakes: "Whether they write it with genuine investment or as an obligation they fulfill minimally."
      opening_line_seed: "I've been thinking about who to ask — and I wanted to come to you."
      npc_goal: "Wants to know why you picked them, not a rehearsed pitch for why you deserve the thing you're applying for."
    scoring_focus: { primary: expression, secondary: clarity }
    success_signal: "made_case_without_entitlement"
    failure_signal: "performed_interest_insincerely"
    possible_outcomes:
      good:
        trigger: "The teacher has agreed and is genuinely invested — the conversation is closing with real warmth."
        closing_seed: "I'd be glad to write it. I think I have something genuine to say."
      neutral:
        trigger: "The teacher has agreed and will treat it as a standard task — the exchange is closing professionally."
        closing_seed: "Sure. Send me the details and I'll put something together."
      poor:
        trigger: "The teacher has agreed reluctantly — their enthusiasm for you has not improved and the conversation is ending flatly."
        closing_seed: "I'll do it. Send me what you need."

  # --- additional colleague seed ---

  - id: taking_on_too_much
    title: "Overcommitted"
    compatible_roles: [colleague]
    category: workplace
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "A colleague asks directly whether you can actually handle everything you've agreed to, because it affects their work too."
      stakes: "Whether they trust your self-assessment going forward."
      opening_line_seed: "I'm not trying to pile on — but are you actually okay with the current load?"
      npc_goal: "Wants your real capacity, not reassurance that everything is under control."
    scoring_focus: { primary: clarity, secondary: expression }
    success_signal: "named_own_shortfall_honestly"
    failure_signal: "gave_hollow_validation"
    possible_outcomes:
      good:
        trigger: "The honesty has prompted a genuine offer to help redistribute — trust has deepened and the conversation is closing with alignment."
        closing_seed: "Okay. Let's look at the list together and figure out what makes sense."
      neutral:
        trigger: "The minimization has been noted — the colleague is backing off but filing it, and the conversation is winding down."
        closing_seed: "Alright. Just let me know if anything shifts."
      poor:
        trigger: "The false reassurance has registered — the colleague's confidence in your judgment has dropped and the conversation is ending with that weight."
        closing_seed: "Right. Well, I hope it doesn't become a problem for the rest of us."

  # --- additional client seeds ---

  - id: client_timeline_slipping
    title: "Timeline Update"
    compatible_roles: [client]
    category: high_pressure
    tier: 3
    npc_context:
      metric_overrides: {}
    context:
      premise: "A client asks for a status update on timing, and the honest answer is that you're behind."
      stakes: "Whether you give them a real number or one you can't actually hit."
      opening_line_seed: "I wanted to check in on timing — where are we actually?"
      npc_goal: "Wants the real date, not a managed estimate."
    scoring_focus: { primary: clarity, secondary: empathy }
    success_signal: "delivered_bad_news_directly"
    failure_signal: "softened_truth_into_vagueness"
    possible_outcomes:
      good:
        trigger: "The client has adjusted expectations and the relationship is holding — the conversation is closing with honest footing established."
        closing_seed: "Okay. I appreciate the heads-up. Let's work with that."
      neutral:
        trigger: "The client is unhappy but working with the new timeline — the conversation is ending with dissatisfaction but no rupture."
        closing_seed: "It's not ideal, but okay. Keep me updated."
      poor:
        trigger: "The vagueness has read as evasion — the client is ending the call with reduced trust and visible frustration."
        closing_seed: "I need real numbers from you, not approximations."

  - id: client_scope_clarification
    title: "What's Included"
    compatible_roles: [client]
    category: workplace
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "A client asks whether a specific thing is included in the current agreement — it isn't, but the line was never drawn clearly."
      stakes: "Whether you clarify the scope now or let the ambiguity compound."
      opening_line_seed: "I assumed that was part of what we agreed — is it not?"
      npc_goal: "Wants a straight answer about what they're getting, not a negotiation."
    scoring_focus: { primary: clarity, secondary: politeness }
    success_signal: "held_boundary_with_warmth"
    failure_signal: "softened_truth_into_vagueness"
    possible_outcomes:
      good:
        trigger: "Scope has been clarified cleanly and expectations have been reset — the conversation is closing with clear mutual understanding."
        closing_seed: "Alright. That's actually clearer than I expected. Thanks for being direct."
      neutral:
        trigger: "The answer has been accepted but the ambiguity has been noted as yours — the conversation is ending with a mild reservation."
        closing_seed: "Okay. I just wanted it on the record."
      poor:
        trigger: "The hedging has left the client unsure what they have — trust is eroding as the conversation closes."
        closing_seed: "I'm still not sure I know exactly what I'm getting."

  # --- additional family seeds ---

  - id: parent_noticed_something_off
    title: "You Seem Off"
    compatible_roles: [family]
    category: everyday_social
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "A parent mentions you haven't seemed like yourself lately and asks what's going on."
      stakes: "Whether you tell them something real or give them the version that stops the question."
      opening_line_seed: "I'm not trying to pry — I just notice things. Are you alright?"
      npc_goal: "Wants an actual answer, not reassurance that everything is fine."
    scoring_focus: { primary: expression, secondary: empathy }
    success_signal: "shared_uncertainty_without_deflecting"
    failure_signal: "gave_hollow_validation"
    possible_outcomes:
      good:
        trigger: "A real moment has passed between you — something genuine was shared and closeness has risen."
        closing_seed: "Thank you for telling me. I'm always here, you know that."
      neutral:
        trigger: "Enough was given to satisfy the question — the conversation is closing without shift."
        closing_seed: "Okay. Well, I'm glad you're alright."
      poor:
        trigger: "The performance of fine has registered — the parent is ending the conversation with the same concern they started with."
        closing_seed: "Alright. Let me know if you need anything."

  - id: sibling_pushing_back
    title: "Called Out"
    compatible_roles: [family]
    category: high_pressure
    tier: 3
    npc_context:
      metric_overrides: {}
    context:
      premise: "A sibling tells you they've noticed a specific behavior of yours that bothers them, and names it plainly."
      stakes: "Whether you respond to what they actually said or defend against a version of it."
      opening_line_seed: "I'm not attacking you — I just think you do this thing where you..."
      npc_goal: "Wants you to actually consider the observation, not close the conversation down."
    scoring_focus: { primary: empathy, secondary: clarity }
    success_signal: "acknowledged_pattern_not_just_instance"
    failure_signal: "deflected_onto_circumstances"
    possible_outcomes:
      good:
        trigger: "The observation was taken in plainly — something shifted and the conversation is closing with trust having risen."
        closing_seed: "I'm glad you didn't just get defensive. That's all I wanted."
      neutral:
        trigger: "Neither accepted nor rejected — the conversation is ending without resolution."
        closing_seed: "Okay. Just think about it."
      poor:
        trigger: "The defense against the observation has closed the conversation down — closeness has dropped."
        closing_seed: "Fine. Forget I said anything."

  # --- recurring_stranger_remembers_you kept below ---

  - id: recurring_stranger_remembers_you
    title: "I've Seen You Here Before"
    compatible_roles: [recurring_stranger]
    category: everyday_social
    tier: 2
    npc_context:
      metric_overrides: {}
    context:
      premise: "Someone you've walked past several times starts a conversation and mentions they've noticed you before."
      stakes: "Low — but you're now learning what impression you left without trying to leave one."
      opening_line_seed: "You're always here around this time, aren't you. I feel like I've seen you before."
      npc_goal: "Wants to find out if talking to you matches what they thought watching you."
    scoring_focus: { primary: expression, secondary: politeness }
    success_signal: "engaged_authentically_with_being_remembered"
    failure_signal: "performed_interest_insincerely"
    possible_outcomes:
      good:
        trigger: "A small real connection has formed that neither expected — the conversation is closing with something having shifted."
        closing_seed: "I'm glad I said something. See you around."
      neutral:
        trigger: "A pleasant exchange has concluded — the stranger logged it without surprise."
        closing_seed: "Anyway. Good to finally say hello."
      poor:
        trigger: "Something didn't match what they thought — the impression has adjusted downward and the conversation is ending awkwardly."
        closing_seed: "Right. Well. Anyway."


distribution_bands:
  - level_range: [1, 30]
    weights: { everyday_social: 60, friendship: 25, workplace: 10, high_pressure: 5 }
  - level_range: [31, 70]
    weights: { everyday_social: 20, friendship: 30, workplace: 35, high_pressure: 15 }
  - level_range: [71, 100]
    weights: { everyday_social: 5, friendship: 20, workplace: 35, high_pressure: 40 }

relationship_tiers:
  thresholds: [0.0, 0.25, 0.45, 0.65, 0.85]
  labels:
    friend:    [Stranger, Acquaintance, Comfortable, Trusted, "Close Friend"]
    teacher:   [Unfamiliar, Noted, Respected, Trusted, "Regarded Highly"]
    colleague: [Unfamiliar, Coworker, Dependable, Trusted, "Strong Ally"]
    client:    [Unknown, Skeptical, Professional, Reliable, "Trusted Partner"]
    family:    [Estranged, Distant, Present, Close, "Deeply Connected"]
    stranger:  [Unnoticed, Noticed, Familiar, "Warmly Familiar", "Unexpectedly Known"]
