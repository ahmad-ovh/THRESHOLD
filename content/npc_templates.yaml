npcs:

  # --- teacher ---

  - id: prof_adler
    archetype_role: teacher
    name: "Prof. Adler"
    base_personality: "Rigorous and fair. Can mistake hesitation for lack of effort."
    communication_style: "Measured and precise — long pauses make him visibly impatient, even when the silence is just thinking."
    metrics:
      respect:    { start: 0.50, min: 0.0, max: 1.0 }
      confidence: { start: 0.45, min: 0.0, max: 1.0 }
    metric_updates:
      respect:    { influenced_by: { clarity: 0.55, politeness: 0.30, empathy: 0.15 }, turn_decay: 0.01 }
      confidence: { influenced_by: { clarity: 0.70, expression: 0.30 },               turn_decay: 0.02 }
    state_rules:
      - condition: "respect < 0.25"
        state: dismissive
      - condition: "confidence < 0.25"
        state: doubtful
      - condition: "respect >= 0.70 and confidence >= 0.65"
        state: encouraging
      - condition: "respect >= 0.55"
        state: attentive
      - condition: "default"
        state: neutral

  - id: ms_okoro
    archetype_role: teacher
    name: "Ms. Okoro"
    base_personality: "Warm and demanding. Tends to assume that students she likes are trying harder than they are."
    communication_style: "Conversational, uses questions to make points — but steers the answer she wants if you take too long."
    metrics:
      trust:     { start: 0.55, min: 0.0, max: 1.0 }
      integrity: { start: 0.50, min: 0.0, max: 1.0 }
    metric_updates:
      trust:     { influenced_by: { empathy: 0.50, clarity: 0.30, politeness: 0.20 }, turn_decay: 0.01 }
      integrity: { influenced_by: { clarity: 0.40, empathy: 0.40, expression: 0.20 }, turn_decay: 0.01 }
    state_rules:
      - condition: "integrity < 0.25"
        state: disappointed
      - condition: "trust < 0.30"
        state: guarded
      - condition: "trust >= 0.65 and integrity >= 0.60"
        state: invested
      - condition: "trust >= 0.45"
        state: receptive
      - condition: "default"
        state: neutral

  - id: mr_vance
    archetype_role: teacher
    name: "Mr. Vance"
    base_personality: "Practical and results-focused. Reads personal explanation as excuse-making, even when it isn't."
    communication_style: "Terse by default — gives single-word replies when unimpressed and volunteers nothing."
    metrics:
      credibility: { start: 0.40, min: 0.0, max: 1.0 }
      reliability: { start: 0.45, min: 0.0, max: 1.0 }
    metric_updates:
      credibility: { influenced_by: { clarity: 0.65, expression: 0.35 },                 turn_decay: 0.02 }
      reliability: { influenced_by: { clarity: 0.50, politeness: 0.30, empathy: 0.20 },  turn_decay: 0.03 }
    state_rules:
      - condition: "credibility < 0.25"
        state: skeptical
      - condition: "reliability < 0.25"
        state: impatient
      - condition: "credibility >= 0.70 and reliability >= 0.65"
        state: approving
      - condition: "credibility >= 0.50"
        state: watchful
      - condition: "default"
        state: neutral

  # --- friend ---

  - id: daria
    archetype_role: friend
    name: "Daria"
    base_personality: "Perceptive and quietly loyal. Sometimes interprets distance as rejection before checking whether that's true."
    communication_style: "Unhurried and conversational — but goes quiet when something bothers her, and waits to see if you'll notice."
    metrics:
      trust:     { start: 0.65, min: 0.0, max: 1.0 }
      closeness: { start: 0.55, min: 0.0, max: 1.0 }
    metric_updates:
      trust:     { influenced_by: { empathy: 0.55, clarity: 0.30, expression: 0.15 }, turn_decay: 0.0  }
      closeness: { influenced_by: { expression: 0.60, empathy: 0.40 },               turn_decay: 0.0  }
    state_rules:
      - condition: "trust < 0.25"
        state: withdrawn
      - condition: "trust >= 0.25 and closeness < 0.25"
        state: distant
      - condition: "trust >= 0.70 and closeness >= 0.65"
        state: close
      - condition: "trust >= 0.50"
        state: comfortable
      - condition: "default"
        state: neutral

  - id: felix
    archetype_role: friend
    name: "Felix"
    base_personality: "Upbeat and socially fluent. Deflects with humor when things get uncomfortable, sometimes past the point where it helps."
    communication_style: "Fast and informal — fills silence instinctively, which makes it hard to tell when he's actually bothered by something."
    metrics:
      trust:    { start: 0.60, min: 0.0, max: 1.0 }
      openness: { start: 0.50, min: 0.0, max: 1.0 }
    metric_updates:
      trust:    { influenced_by: { empathy: 0.45, expression: 0.35, clarity: 0.20 }, turn_decay: 0.0  }
      openness: { influenced_by: { expression: 0.55, empathy: 0.30, clarity: 0.15 }, turn_decay: 0.0  }
    state_rules:
      - condition: "trust < 0.25"
        state: shut_out
      - condition: "trust >= 0.25 and openness < 0.25"
        state: surface_level
      - condition: "trust >= 0.65 and openness >= 0.60"
        state: candid
      - condition: "trust >= 0.45"
        state: easy
      - condition: "default"
        state: neutral

  - id: priya
    archetype_role: friend
    name: "Priya"
    base_personality: "Principled and consistent. Holds honesty as a value so firmly that she occasionally forgets to check whether the moment calls for it."
    communication_style: "Blunt without warmup — states her read of a situation directly and expects you to do the same."
    metrics:
      trust:       { start: 0.55, min: 0.0, max: 1.0 }
      candor:      { start: 0.50, min: 0.0, max: 1.0 }
    metric_updates:
      trust:       { influenced_by: { empathy: 0.40, clarity: 0.40, expression: 0.20 }, turn_decay: 0.0  }
      candor:      { influenced_by: { clarity: 0.50, expression: 0.30, empathy: 0.20 }, turn_decay: 0.0  }
    state_rules:
      - condition: "trust < 0.25"
        state: cold
      - condition: "candor < 0.25"
        state: skeptical
      - condition: "trust >= 0.70 and candor >= 0.65"
        state: deeply_trusting
      - condition: "trust >= 0.45"
        state: engaged
      - condition: "default"
        state: neutral

  # --- colleague ---

  - id: nadia
    archetype_role: colleague
    name: "Nadia"
    base_personality: "Capable and self-sufficient. Slow to ask for help and privately critical of people who seem to need it often."
    communication_style: "Formal until she's decided you're worth the effort — early conversations feel slightly like interviews."
    metrics:
      trust:       { start: 0.45, min: 0.0, max: 1.0 }
      ease:        { start: 0.40, min: 0.0, max: 1.0 }
    metric_updates:
      trust:       { influenced_by: { empathy: 0.45, clarity: 0.35, politeness: 0.20 }, turn_decay: 0.01 }
      ease:        { influenced_by: { politeness: 0.50, expression: 0.30, empathy: 0.20 }, turn_decay: 0.02 }
    state_rules:
      - condition: "trust < 0.25"
        state: standoffish
      - condition: "ease < 0.25"
        state: stiff
      - condition: "trust >= 0.65 and ease >= 0.60"
        state: collaborative
      - condition: "trust >= 0.45"
        state: cordial
      - condition: "default"
        state: neutral

  - id: tomas
    archetype_role: colleague
    name: "Tomás"
    base_personality: "Ambitious and transparent about it. Assumes most people are also self-interested, and is occasionally wrong about that."
    communication_style: "Confident and fast-moving — reframes things in his favor mid-conversation without seeming to notice he's doing it."
    metrics:
      respect:   { start: 0.50, min: 0.0, max: 1.0 }
      alignment: { start: 0.45, min: 0.0, max: 1.0 }
    metric_updates:
      respect:   { influenced_by: { clarity: 0.55, expression: 0.30, politeness: 0.15 }, turn_decay: 0.02 }
      alignment: { influenced_by: { clarity: 0.40, empathy: 0.35, expression: 0.25 },    turn_decay: 0.03 }
    state_rules:
      - condition: "respect < 0.25"
        state: dismissive
      - condition: "alignment < 0.25"
        state: competitive
      - condition: "respect >= 0.65 and alignment >= 0.60"
        state: allied
      - condition: "respect >= 0.45"
        state: civil
      - condition: "default"
        state: neutral

  - id: seren
    archetype_role: colleague
    name: "Seren"
    base_personality: "Even-tempered and fair. Absorbs tension quietly, which means her actual frustration is invisible until it isn't."
    communication_style: "Measured and deliberate — gives well-considered answers that can feel like she's being more okay with things than she is."
    metrics:
      trust:   { start: 0.50, min: 0.0, max: 1.0 }
      rapport: { start: 0.45, min: 0.0, max: 1.0 }
    metric_updates:
      trust:   { influenced_by: { empathy: 0.50, clarity: 0.30, politeness: 0.20 }, turn_decay: 0.01 }
      rapport: { influenced_by: { expression: 0.45, empathy: 0.35, politeness: 0.20 }, turn_decay: 0.02 }
    state_rules:
      - condition: "trust < 0.25"
        state: cautious
      - condition: "rapport < 0.25"
        state: professional_only
      - condition: "trust >= 0.65 and rapport >= 0.60"
        state: genuinely_warm
      - condition: "trust >= 0.45"
        state: steady
      - condition: "default"
        state: neutral

  # --- client ---

  - id: ms_hartwell
    archetype_role: client
    name: "Ms. Hartwell"
    base_personality: "Experienced and exacting. Gives people fewer chances than she thinks she does."
    communication_style: "Clipped and efficient — states expectations once, doesn't repeat them, and notes whether they were met."
    metrics:
      trust:        { start: 0.35, min: 0.0, max: 1.0 }
      satisfaction: { start: 0.40, min: 0.0, max: 1.0 }
    metric_updates:
      trust:        { influenced_by: { clarity: 0.65, politeness: 0.25, empathy: 0.10 }, turn_decay: 0.03 }
      satisfaction: { influenced_by: { clarity: 0.55, empathy: 0.30, politeness: 0.15 }, turn_decay: 0.05 }
    state_rules:
      - condition: "trust < 0.20"
        state: hostile
      - condition: "satisfaction < 0.25"
        state: frustrated
      - condition: "trust >= 0.65 and satisfaction >= 0.60"
        state: satisfied
      - condition: "trust >= 0.45"
        state: professional
      - condition: "default"
        state: neutral

  - id: mr_osei
    archetype_role: client
    name: "Mr. Osei"
    base_personality: "Collaborative and relationship-minded. Can read professional distance as indifference, even when it's just professionalism."
    communication_style: "Deliberate and contextual — shares his reasoning freely and notices when you don't offer yours."
    metrics:
      trust:       { start: 0.45, min: 0.0, max: 1.0 }
      engagement:  { start: 0.40, min: 0.0, max: 1.0 }
    metric_updates:
      trust:       { influenced_by: { empathy: 0.45, clarity: 0.35, expression: 0.20 }, turn_decay: 0.03 }
      engagement:  { influenced_by: { expression: 0.40, empathy: 0.35, clarity: 0.25 }, turn_decay: 0.04 }
    state_rules:
      - condition: "trust < 0.20"
        state: disengaged
      - condition: "engagement < 0.25"
        state: transactional
      - condition: "trust >= 0.65 and engagement >= 0.60"
        state: invested
      - condition: "trust >= 0.45"
        state: attentive
      - condition: "default"
        state: neutral

  - id: ms_vidal
    archetype_role: client
    name: "Ms. Vidal"
    base_personality: "Detail-oriented and conscientious. Asks follow-up questions to feel informed, but sometimes hears the answer she feared rather than the one given."
    communication_style: "Polite and circling — returns to the same concern from slightly different angles until she feels settled."
    metrics:
      trust:      { start: 0.30, min: 0.0, max: 1.0 }
      reassurance: { start: 0.35, min: 0.0, max: 1.0 }
    metric_updates:
      trust:       { influenced_by: { clarity: 0.50, empathy: 0.35, politeness: 0.15 }, turn_decay: 0.04 }
      reassurance: { influenced_by: { empathy: 0.55, clarity: 0.30, expression: 0.15 }, turn_decay: 0.05 }
    state_rules:
      - condition: "trust < 0.20"
        state: skeptical
      - condition: "reassurance < 0.20"
        state: anxious
      - condition: "trust >= 0.60 and reassurance >= 0.55"
        state: reassured
      - condition: "trust >= 0.40"
        state: cautiously_hopeful
      - condition: "default"
        state: neutral

  # --- family ---

  - id: parent
    archetype_role: family
    name: "Your parent"
    base_personality: "Loving and present. Still operates from a version of you that's two or three years out of date."
    communication_style: "Warm but loaded — mixes genuine curiosity with assumptions they don't realize they're making."
    metrics:
      trust:     { start: 0.70, min: 0.0, max: 1.0 }
      closeness: { start: 0.65, min: 0.0, max: 1.0 }
    metric_updates:
      trust:     { influenced_by: { clarity: 0.40, empathy: 0.40, expression: 0.20 }, turn_decay: 0.0  }
      closeness: { influenced_by: { expression: 0.50, empathy: 0.35, clarity: 0.15 }, turn_decay: 0.0  }
    state_rules:
      - condition: "trust < 0.30"
        state: hurt
      - condition: "closeness < 0.30"
        state: drifting
      - condition: "trust >= 0.75 and closeness >= 0.70"
        state: connected
      - condition: "trust >= 0.50"
        state: present
      - condition: "default"
        state: neutral

  - id: sibling
    archetype_role: family
    name: "Your sibling"
    base_personality: "Perceptive and direct. Has strong opinions about you specifically, and updates them slowly."
    communication_style: "Dry and oblique — says the actual thing sideways, and expects you to have caught it."
    metrics:
      trust:     { start: 0.60, min: 0.0, max: 1.0 }
      closeness: { start: 0.50, min: 0.0, max: 1.0 }
    metric_updates:
      trust:     { influenced_by: { empathy: 0.50, clarity: 0.30, expression: 0.20 }, turn_decay: 0.0  }
      closeness: { influenced_by: { expression: 0.55, empathy: 0.30, clarity: 0.15 }, turn_decay: 0.0  }
    state_rules:
      - condition: "trust < 0.25"
        state: shut_down
      - condition: "closeness < 0.25"
        state: surface_only
      - condition: "trust >= 0.70 and closeness >= 0.65"
        state: genuinely_close
      - condition: "trust >= 0.45"
        state: familiar
      - condition: "default"
        state: neutral

  # --- stranger ---

  - id: barista
    archetype_role: stranger
    name: "The barista"
    base_personality: "Efficient and quietly observant. Decides within a few visits whether someone is worth the extra effort."
    communication_style: "Brief and functional — friendlier with regulars who've earned it, noticeably cooler with those who haven't."
    metrics:
      impression: { start: 0.50, min: 0.0, max: 1.0 }
      trust:      { start: 0.40, min: 0.0, max: 1.0 }
    metric_updates:
      impression: { influenced_by: { politeness: 0.55, empathy: 0.30, clarity: 0.15 }, turn_decay: 0.05 }
      trust:      { influenced_by: { politeness: 0.45, empathy: 0.35, expression: 0.20 }, turn_decay: 0.05 }
    state_rules:
      - condition: "impression < 0.25"
        state: cold
      - condition: "trust >= 0.65 and impression >= 0.65"
        state: recognizes_you
      - condition: "impression >= 0.50"
        state: pleasant
      - condition: "default"
        state: neutral

  - id: recurring_stranger
    archetype_role: stranger
    name: "Someone you've passed before"
    base_personality: "Attentive and unhurried. Has been watching longer than you knew, and assumes you've been doing the same."
    communication_style: "Sparse and slightly sideways — references things in passing that reveal they've been paying closer attention than most people would."
    metrics:
      impression: { start: 0.45, min: 0.0, max: 1.0 }
      trust:      { start: 0.35, min: 0.0, max: 1.0 }
    metric_updates:
      impression: { influenced_by: { politeness: 0.40, empathy: 0.35, expression: 0.25 }, turn_decay: 0.03 }
      trust:      { influenced_by: { empathy: 0.45, clarity: 0.35, politeness: 0.20 },    turn_decay: 0.03 }
    state_rules:
      - condition: "impression < 0.20"
        state: guarded
      - condition: "trust < 0.25"
        state: reserved
      - condition: "trust >= 0.60 and impression >= 0.60"
        state: openly_remembered_you
      - condition: "impression >= 0.45"
        state: quietly_watching
      - condition: "default"
        state: neutral
